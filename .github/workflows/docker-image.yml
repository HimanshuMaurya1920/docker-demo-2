name: Docker Image CI

on:
  push:
    branches: [ "main" ]


jobs:

  build-and-push-run:

    runs-on: ubuntu-latest

    steps:
      # step1
    - uses: actions/checkout@v4

    # step 2
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag bebanana18/docker-demo2:latest

    # push to dockerhub
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    - name: Push the Docker image
      run: docker push bebanana18/docker-demo2:latest

    # deploy on EC2
    - uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        port: 22
        script: |
          cd /home/ubuntu/docker-demo-2
          git pull
          docker compose down
          docker compose  --no-cache --build -d


